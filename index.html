<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Story Atlas</title>
    <link rel="icon" type="image/png" href="./assets/story-atlas-logo.png" />
    <link rel="apple-touch-icon" href="./assets/story-atlas-logo.png" />
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <span id="render-health" class="sr-only" aria-live="polite">Checking render</span>
      <section class="map-stage" aria-label="Interactive Atlas globe">
        <canvas id="globe" aria-hidden="true"></canvas>
        <div id="globe-labels" class="globe-labels" aria-hidden="true"></div>
        <div class="scanline" aria-hidden="true"></div>

        <header class="topbar">
          <div>
            <p class="eyebrow">ArcGIS StoryMaps</p>
            <h1>Story Atlas</h1>
          </div>
          <div class="top-actions">
            <div class="year-switch" role="tablist" aria-label="Story year">
              <button type="button" data-year="2026" role="tab">2026</button>
              <button type="button" data-year="2025" role="tab">2025</button>
              <button type="button" data-year="2024" role="tab">2024</button>
            </div>
            <div class="status-pill">
              <span id="story-count">0</span>
              <span>curated stories</span>
            </div>
          </div>
        </header>

        <aside id="story-panel" class="story-panel" aria-label="Story details">
          <div class="panel-head">
            <div class="panel-kicker">
              <span id="active-category">Environment</span>
              <span id="active-year">2026</span>
            </div>
            <button id="panel-toggle" class="panel-toggle" type="button" aria-controls="story-panel-body" aria-expanded="true" aria-label="Collapse story details" title="Collapse story details">
              <span class="collapse-icon" aria-hidden="true"></span>
            </button>
          </div>
          <div id="story-panel-body" class="panel-body">
            <h2 id="active-title">Loading stories...</h2>
            <p id="active-summary"></p>
            <dl class="meta-grid">
              <div>
                <dt>Place</dt>
                <dd id="active-place"></dd>
              </div>
              <div>
                <dt>Highlights</dt>
                <dd id="active-strength"></dd>
              </div>
            </dl>
            <div class="panel-actions">
              <a id="active-link" class="button primary" target="_blank" rel="noreferrer" aria-label="Open story in new tab">Open story</a>
              <div class="icon-actions">
                <button id="focus-button" class="icon-button" type="button" aria-label="Show on map" title="Show on map">
                  <span class="map-icon" aria-hidden="true"></span>
                </button>
                <button id="autoplay-button" class="icon-button autoplay-button" type="button" aria-pressed="true" aria-label="Pause autoplay" title="Pause autoplay">
                  <span class="pause-icon" aria-hidden="true"></span>
                  <span id="autoplay-label" class="sr-only">Pause</span>
                </button>
              </div>
            </div>
          </div>
        </aside>

        <nav class="dock" aria-label="Story list">
          <ol id="story-list" class="story-list"></ol>
        </nav>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "@vercel/speed-insights": "https://unpkg.com/@vercel/speed-insights@2.0.0/dist/index.mjs"
        }
      }
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
